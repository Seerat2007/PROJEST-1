<main class="weather-card">
  <!-- City Selector Dropdown -->
  <label for="city-select" class="visually-hidden">Choose city:</label>
  <select id="city-select">
    <option value="chandigarh">Chandigarh</option>
    <option value="london">London</option>
    <option value="tokyo">Tokyo</option>
    <option value="newyork">New York</option>
  </select>

  <h1 id="city">Chandigarh</h1>
  <img
    id="weather-icon"
    src="https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=200&auto=format&fit=crop"
    alt="Weather condition"
  />
  <p id="temperature">--°C</p>
  <p id="condition">Loading...</p>
</main>
